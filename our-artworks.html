<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Our Artworks</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
        }
        .container { max-width: 1200px; margin: auto; }
        h1 { text-align: center; color: #3e8e41; margin: 20px 0; }
        h2 { color: #3e8e41; margin: 30px 0 15px; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 1px solid #ddd;
        }
        .back-button {
            background-color: #3e8e41;
            color: white;
            padding: 10px;
            text-align: center;
            margin-top: 20px;
            cursor: pointer;
            max-width: 200px;
            margin-left: auto;
            margin-right: auto;
            text-decoration: none;
            display: block;
        }
        .back-button:hover { background-color: #2e6e31; }
        @media screen and (max-width: 850px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
        @media screen and (max-width: 400px) { .gallery { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Our Artworks</h1>

        <!-- Forest Section -->
        <h2 id="forest">Forest Photography</h2>
        <div class="gallery">
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZQwSh4TVBYMmGcLytudqcSX_KEm9Mb2iSig&s" alt="Forest Photo 1"></div>
            <div><img src="https://media.istockphoto.com/id/1419410282/photo/silent-forest-in-spring-with-beautiful-bright-sun-rays.jpg?s=612x612&w=0&k=20&c=UHeb1pGOw6ozr6utsenXHhV19vW6oiPIxDqhKCS2Llk=" alt="Forest Photo 2"></div>
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcQe7hVf5ruzAVdgMKsk5YADcuF30Xj2GefX7g&s" alt="Forest Photo 3"></div>
        </div>

        <!-- Mountain Section -->
        <h2 id="mountain">Mountain Photography</h2>
        <div class="gallery">
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcQe7hVf5ruzAVdgMKsk5YADcuF30Xj2GefX7g&s" alt="Mountain Photo 1"></div>
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcReGp7LAjPaNhSpdiughTjAGo5SWRwbWf-tww&s" alt="Mountain Photo 2"></div>
            <div><img src="https://cdn.visualwilderness.com/wp-content/uploads/2019/12/Norway-Landscape-Photography-3.jpg" alt="Mountain Photo 3"></div>
        </div>

        <!-- Ocean Section -->
        <h2 id="ocean">Ocean Photography</h2>
        <div class="gallery">
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcQWejj1dpgf1VXuMI03QHLecdef_vB77TnJQA&s" alt="Ocean Photo 1"></div>
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcRD3fKHg9-THfJ23fURU8VhHaO1IGrDvaLAKg&s" alt="Ocean Photo 2"></div>
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcTm6mmYETVoiAFjkiYSV-s-YuuWRCLuqH8cLQ&s" alt="Ocean Photo 3"></div>
        </div>

        <!-- Wildlife Section -->
        <h2 id="wildlife">Wildlife Photography</h2>
        <div class="gallery">
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcR2R_LL-ckMC_jczQeUdP9fgnw1SrPrh-ESOQ&s" alt="Wildlife Photo 1"></div>
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcSF1wHHq6PKNXIyGTspt_n36XyYKtxsYkpOiA&s" alt="Wildlife Photo 2"></div>
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn&utm9GcQXbACB9bxtRuo7rV0QILnvd41-02cJ9jUipQ&s" alt="Wildlife Photo 3"></div>
        </div>

        <a href="index.html" class="back-button">Back to Home</a>
    </div>
</body>
</html>
